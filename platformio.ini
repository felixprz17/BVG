; PlatformIO-Projekt (alternativ zur Arduino IDE). Build:  pio run   Upload:  pio run -t upload
[platformio]
src_dir = bvg_matrix

[env:matrixportal_s3]
platform = espressif32@^6.9.0
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv   ; zwei App-Slots (OTA) + Dateisystem
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.12
    adafruit/Adafruit GFX Library
    olikraus/U8g2_for_Adafruit_GFX
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Falls dein PlatformIO das Board nicht kennt: generisches S3-Board (Pins stehen im Sketch)
[env:generic_s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
lib_deps = ${env:matrixportal_s3.lib_deps}
build_flags = ${env:matrixportal_s3.build_flags}
